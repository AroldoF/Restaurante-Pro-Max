version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  items-service:
    build: ./items
    container_name: items-service
    ports:
      - "8001:8001"

  orders-service:
    build: ./orders
    container_name: orders-service
    ports:
      - "8002:8002"
    environment:
      - ITEMS_SERVICE_URL=http://items-service:8001
    depends_on:
      - items-service

  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "8009:8009"
    environment:
      - DATABASE_URL=sqlite:///payments.db
      - ORDER_API_URL=http://orders-service:8002/orders
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
    depends_on:
      rabbitmq:
        condition: service_healthy
      orders-service:
        condition: service_started
    restart: on-failure

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "8010:8010"
    environment:
      - DATABASE_URL=sqlite:///notification.db
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure